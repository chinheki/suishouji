<!doctype html><meta charset="utf-8"><title>记录兼容验证</title><pre id="results">运行中</pre><script type="module">
import {openDatabase,recordOnce} from '../storage.js?v=25';
const name='suishouji-test-'+crypto.randomUUID(),lines=[];let db;
const assert=(v,s)=>{if(!v)throw Error(s);lines.push('PASS '+s)};
const write=(store,op)=>new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');op(tx.objectStore(store));tx.oncomplete=res;tx.onabort=()=>rej(tx.error)});
const count=()=>new Promise(res=>{const r=db.transaction('events').objectStore('events').count();r.onsuccess=()=>res(r.result)});
const event=(tagId)=>({id:crypto.randomUUID(),tagId,occurredAt:'2026-10-01T10:00:00.000Z'});
try{
 db=await openDatabase(name);
 for(const cycleDays of [null,1,7,30,3,-1]){
 const id=String(cycleDays);await write('tags',s=>s.add({id,name:id,group:'conditions',cycleDays}));
 const results=await Promise.all([recordOnce(db,event(id)),recordOnce(db,event(id))]);
 assert(results.every(r=>r.status==='saved'),'旧周期 '+id+' 同一时刻并发两条均保存');
 }
 const e=event('1');await recordOnce(db,e);const before=await count();await write('events',s=>s.delete(e.id));assert(await count()===before-1,'撤销仅删除该次记录');
 assert((await recordOnce(db,event('1'))).status==='saved','撤销后可重记');
 await write('tags',s=>s.put({id:'1',name:'1',group:'conditions',archived:true}));assert((await recordOnce(db,event('1'))).status==='unavailable','已归档标签仍禁止记录');
 assert((await recordOnce(db,event('missing'))).status==='unavailable','不存在标签禁止记录');
 const duplicate=event('7');await recordOnce(db,duplicate);let rejected=false;try{await recordOnce(db,duplicate)}catch{rejected=true}assert(rejected,'同一事件ID不可重复写入');
 document.getElementById('results').textContent=lines.join('\n');
}catch(e){document.getElementById('results').textContent=lines.join('\n')+'\nFAIL '+e;}
finally{db?.close();indexedDB.deleteDatabase(name)}
</script>
